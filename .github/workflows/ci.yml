name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras --group dev
      - name: Format, lint and types
        run: |
          uv run black --check .
          uv run ruff check .
          uv run mypy src
      - name: Tests
        run: uv run pytest --cov --cov-report=term --cov-fail-under=80
      - name: Generated artefacts are current
        run: |
          uv run python tools/build_toy.py
          uv run python tools/gen_contract.py
          git diff --exit-code
      - name: Install secret scanner
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Release scan
        run: uv run python tools/scan_release.py
      - name: Dependency audit
        run: uv run --locked pip-audit
      - name: Build and verify distributions
        run: |
          uv build --out-dir dist
          uv run --locked python tools/check_package.py --dist dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
