name: ci

# The release workflow builds assets only from a commit on which this workflow's
# `checks` and `site` jobs both succeeded (tools/release_gate.py). Keep those job names;
# `checks` is also the branch-protection required check.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash # -eo pipefail

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request runs are cancelled; every main commit keeps its own verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release scan reads the whole history
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"
          python-version: "3.12"
      - run: uv sync --locked --all-extras --group dev
      - name: Format, lint and types
        run: |
          uv run black --check .
          uv run ruff check .
          uv run mypy src
      - name: Tests
        run: uv run pytest --cov --cov-report=term --cov-fail-under=80
      - name: Generated artefacts are current
        run: |
          uv run python tools/build_toy.py
          uv run python tools/gen_contract.py
          git diff --exit-code
      - name: Install secret scanner
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Release scan
        run: uv run python tools/scan_release.py
      - name: Dependency audit
        run: uv run pip-audit
      - name: Build and verify distributions
        run: |
          uv build --out-dir "$RUNNER_TEMP/dist"
          uv run python tools/check_package.py --dist "$RUNNER_TEMP/dist"

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build # type-check, then bake src/data/*.json into static HTML
