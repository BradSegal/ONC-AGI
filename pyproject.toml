[project]
name = "onc-agi"
version = "1.0.0rc4"
description = "A biomarker-discovery benchmark runtime, scorer and agent toolkit."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Bradley Segal" }]
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "pandas>=2.2,<4",
  "pyarrow>=16",
  "pydantic>=2.8,<3",
  "scikit-learn>=1.8,<2",
  "statsmodels>=0.14,<0.16",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
knockoffs = ["knockpy>=1.3"]
inspect = ["inspect-ai>=0.3.200"]

[project.scripts]
onc-agi = "onc_agi.adapters.cli:main"

[project.urls]
Repository = "https://github.com/BradSegal/ONC-AGI"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/onc_agi"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["src/onc_agi", "README.md", "LICENSE", "EXPORT.json"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6",
  "hypothesis>=6.100",
  "black>=24",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs",
  "jsonschema>=4.23",
  "twine>=6.2,<7",
  "check-wheel-contents>=0.6,<1",
  "pip-audit>=2.9,<3",
]

[tool.black]
line-length = 110
target-version = ["py312"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["."]  # same import grouping as the upstream source of the exported runtime

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = ["src"]
explicit_package_bases = true
exclude = ["tests/", "examples/"]

[[tool.mypy.overrides]]
# inspect-ai is an optional extra; without it its decorators are untyped.
module = ["onc_agi.adapters.inspect_task"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["statsmodels.*", "sklearn.*", "knockpy.*", "pyarrow.*", "scipy.*", "inspect_ai.*", "uvicorn.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "unit: pure logic, no I/O",
  "integration: components across a boundary (filesystem, HTTP, packages)",
  "statistical: Monte Carlo or distributional properties with declared tolerances",
  "e2e: full consumer workflow from world construction to scorecard",
  "adversarial: gaming and shortcut strategies that must fail",
  "data: requires vendored real cohorts under data/vendored",
  "slow: longer than ~30 s",
  "docker: requires a Docker daemon",
  "preview: ONC-AGI release checks (fixtures, schemas, docs, export hygiene)",
]

[tool.coverage.run]
source = ["onc_agi"]
branch = true
